name: GDAI-BACK unit and PostgreSQL integration tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/gdai-back-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/gdai-back-tests.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gardnaize
          POSTGRES_USER: gardnaize
          POSTGRES_PASSWORD: gardnaize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gardnaize -d gardnaize"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/gardnaize
      DB_USER: gardnaize
      DB_PASSWORD: gardnaize_test
      VISION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and PostgreSQL integration tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
