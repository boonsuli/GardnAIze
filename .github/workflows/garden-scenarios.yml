name: Garden scenario validation
on:
  pull_request:
    paths:
      - 'gdai-plant/data/scenarios/**'
      - 'gdai-plant/matching/**'
      - 'gdai-plant/tests/test_*scenario*.py'
      - '.github/workflows/garden-scenarios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gdai-plant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*scenario*.py'
      - run: python -m matching.finalize_garden_scenarios
      - run: git diff --exit-code -- data/scenarios/garden-scenarios-final-v2.json
