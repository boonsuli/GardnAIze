name: GardnAIze CI/CD

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

env:
    AWS_REGION: eu-west-3

jobs:
    formatting:
        name: Four-space formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check whitespace (4-space indentation, no tabs)
              run: |
                  python scripts/check_indentation.py

    frontend-unit:
        name: Frontend build and unit tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Upgrade npm
              run: npm install -g npm@11
            - name: Install dependencies
              run: npm install --no-audit --no-fund
            - name: Unit tests
              run: npm run test:unit
            - name: Production build
              run: npm run build

    ai-unit:
        name: AI unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - name: Install dependencies
              run: pip install -r ai-service/requirements-dev.txt
            - name: Unit tests
              working-directory: ai-service
              run: python -m pytest -q tests

    backend-unit:
        name: Java 25 Corretto backend unit tests and build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: corretto
                  java-version: '25'
                  cache: maven
                  cache-dependency-path: backend/pom.xml
            - name: Maven unit tests and package
              run: mvn -B verify

    docker-integration:
        name: Docker images and integration tests
        needs:
            - frontend-unit
            - ai-unit
            - backend-unit
            - formatting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Validate Compose
              run: docker compose config --quiet
            - name: Build Docker images
              run: docker compose build
            - name: Start containers
              run: docker compose up -d --wait
            - name: Integration smoke tests
              run: |
                  curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
                  curl --fail --silent --show-error http://127.0.0.1:8000/health | grep '"status":"ok"'
                  curl --fail --silent --show-error http://127.0.0.1:8000/openapi.json | grep 'GardnAIze'
                  curl --fail --silent --show-error http://127.0.0.1:8081/v3/api-docs | grep 'gardens'
                  curl --fail --silent --show-error http://127.0.0.1:8081/actuator/health | grep '"status":"UP"'
                  curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/v1/gardens -H 'Content-Type: application/json' -d '{"name":"CI garden","location":"Paris","exposure":"FULL_SUN","soilType":"LOAMY"}' > /tmp/garden.json
                  python -c "import json; p=json.load(open('/tmp/garden.json')); assert p['id']"
                  GARDEN_ID=$(python -c "import json; print(json.load(open('/tmp/garden.json'))['id'])")
                  curl --fail --silent --show-error "http://127.0.0.1:8080/api/v1/gardens/$GARDEN_ID/recommendations" > /tmp/recommendations.json
                  python -c "import json; r=json.load(open('/tmp/recommendations.json')); assert r['mode']=='demo-rules-not-ai' and len(r['plants'])==3"
            - name: Logs on failure
              if: failure()
              run: docker compose logs --no-color
            - name: Stop containers
              if: always()
              run: docker compose down

    publish-ecr:
        name: Publish Docker images to AWS ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
        needs: docker-integration
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}
            - name: Login to Amazon ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Build and push frontend
              env:
                  REGISTRY: ${{ steps.ecr.outputs.registry }}
                  SHA: ${{ github.sha }}
              run: |
                  docker build -t "$REGISTRY/gardnaize-frontend:$SHA" ./frontend
                  docker push "$REGISTRY/gardnaize-frontend:$SHA"
            - name: Build and push backend
              env:
                  REGISTRY: ${{ steps.ecr.outputs.registry }}
                  SHA: ${{ github.sha }}
              run: |
                  docker build -t "$REGISTRY/gardnaize-backend:$SHA" ./backend
                  docker push "$REGISTRY/gardnaize-backend:$SHA"
            - name: Build and push AI service
              env:
                  REGISTRY: ${{ steps.ecr.outputs.registry }}
                  SHA: ${{ github.sha }}
              run: |
                  docker build -t "$REGISTRY/gardnaize-ai-service:$SHA" ./ai-service
                  docker push "$REGISTRY/gardnaize-ai-service:$SHA"
