# Local-only overrides for the existing production-like compose.yaml.
# Run: docker compose -f compose.yaml -f compose.local.yaml up --build -d --wait
services:
    frontend:
        ports: !override
            - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    backend:
        environment:
            CORS_ALLOWED_ORIGIN: "http://localhost:${FRONTEND_PORT:-8080}"
    postgres:
        ports:
            - "127.0.0.1:${DB_PORT:-5432}:5432"
