server:
    port: 8081

spring:
    application:
        name: gardnaize-backend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/gardnaize}
        username: ${DB_USER:gardnaize}
        password: ${DB_PASSWORD:}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    flyway:
        enabled: true

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true

springdoc:
    swagger-ui:
        path: /swagger-ui.html
    api-docs:
        path: /v3/api-docs

gardnaize:
    ai:
        base-url: ${AI_BASE_URL:http://localhost:8000}
    cors:
        allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

logging:
    level:
        root: ${LOG_LEVEL:INFO}
        com.gardnaize: ${APP_LOG_LEVEL:INFO}
