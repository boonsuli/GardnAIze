server:
    port: 8081

spring:
    application:
        name: gardnaize-backend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/gardnaize}
        username: ${DB_USER:gardnaize}
        password: ${DB_PASSWORD:}
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                default_schema: public
                jdbc:
                    time_zone: UTC
    flyway:
        enabled: true
        default-schema: public
        schemas:
            - public
            - gardnaize

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true

springdoc:
    swagger-ui:
        path: /swagger-ui.html
    api-docs:
        path: /v3/api-docs

gardnaize:
    ai:
        base-url: ${AI_BASE_URL:http://localhost:8000}
    vision:
        enabled: ${VISION_ENABLED:false}
        base-url: ${VISION_BASE_URL:http://localhost:9000}
        provider-name: ${VISION_PROVIDER_NAME:external-vision}
        api-key: ${VISION_API_KEY:}
    cors:
        allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

logging:
    level:
        root: ${LOG_LEVEL:INFO}
        com.gardnaize: ${APP_LOG_LEVEL:INFO}

spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 11MB
