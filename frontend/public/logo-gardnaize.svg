<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-labelledby="title description">
    <title id="title">GardnAIze</title>
    <desc id="description">GardnAIze logo, green AI with a short I directly joined to the sprout stem and two proportionate veined leaves, barely above the G cap height. Imagine. Design. Grow.</desc>
    <defs>
